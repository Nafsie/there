<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Baby</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #fdf6f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      position: relative;
    }

    canvas#bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 200, 200, 0.35);
      border-radius: 28px;
      padding: 56px 64px 52px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      animation: riseIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      box-shadow: 0 8px 48px rgba(230, 130, 120, 0.10), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
    }

    .ribbon {
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #d4a0a0;
      margin-bottom: 18px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.4rem;
      font-weight: 400;
      line-height: 1.15;
      color: #3a2a2a;
      margin-bottom: 10px;
    }

    h1 em {
      font-style: italic;
      color: #c95f5f;
    }

    .sub {
      font-size: 14px;
      font-weight: 300;
      color: #a07878;
      letter-spacing: 0.5px;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 14px 44px;
      border-radius: 50px;
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #e87878 0%, #c94f6a 100%);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(201, 79, 106, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 28px rgba(201, 79, 106, 0.4);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e0b0b0, transparent);
      margin: 28px auto;
    }

    .signature {
      position: fixed;
      bottom: 28px;
      right: 32px;
      z-index: 3;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 15px;
      color: #c08888;
      opacity: 0.85;
      animation: fadeIn 2s 1s both;
    }

    .heart-icon {
      display: block;
      font-size: 24px;
      margin-bottom: 20px;
      animation: heartbeat 2s ease-in-out infinite;
      color: #e07878;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 0.85; }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      30%       { transform: scale(1.18); }
      60%       { transform: scale(1.06); }
    }

    @media (max-width: 500px) {
      h1 { font-size: 2.5rem; }
      .card { padding: 40px 32px 36px; }
      .btn { padding: 12px 36px; font-size: 13px; }
      .signature { font-size: 13px; bottom: 20px; right: 20px; }
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>

  <div class="card">
    <div class="ribbon">A little something for you</div>
    <span class="heart-icon">♡</span>
    <h1>Hello, <em>Baby…</em></h1>
    <div class="divider"></div>
    <p class="sub">Something beautiful awaits you inside</p>
    <a href="main.html" class="btn">Open</a>
  </div>

  <div class="signature">with lots of love, Eileen ♡</div>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];

    const colors = ['#f7c5c5', '#f9dde0', '#fce4d6', '#f5c6d8', '#edd5f0', '#fad4b4'];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function randomParticle() {
      return {
        x: Math.random() * W,
        y: Math.random() * H + H,
        r: 2 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: 0.3 + Math.random() * 0.6,
        drift: (Math.random() - 0.5) * 0.4,
        alpha: 0.4 + Math.random() * 0.5,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.01 + Math.random() * 0.015,
      };
    }

    function init() {
      resize();
      particles = Array.from({ length: 55 }, randomParticle).map(p => {
        p.y = Math.random() * H;
        return p;
      });
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const grd = ctx.createLinearGradient(0, 0, W, H);
      grd.addColorStop(0, '#fff5f5');
      grd.addColorStop(0.5, '#fdf0ec');
      grd.addColorStop(1, '#faf0f8');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);

      for (const p of particles) {
        p.wobble += p.wobbleSpeed;
        p.x += Math.sin(p.wobble) * p.drift;
        p.y -= p.speed;
        if (p.y + p.r < 0) {
          Object.assign(p, randomParticle());
          p.y = H + p.r;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    init();
    draw();
  </script>

</body>
</html>
