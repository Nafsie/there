<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF‑8">
  <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
  <title>Welcome Baby</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Pacifico', cursive;
      background: #fff url('https://i.imgur.com/EPYdI6Y.png') repeat; /* Crumpled paper texture */
      background-size: cover;
      color: #000;
      overflow: hidden;
      text-align: center;
    }

    .landing-content {
      animation: fadeIn 1.5s ease forwards;
    }

    .cat-img {
      width: 140px;
      margin: 0 auto 20px;
      animation: bounce 2s infinite alternate;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    h1 span.red {
      color: #e63946; /* Red for "Baby" */
    }

    .enter-button {
      display: inline-block;
      padding: 15px 50px;
      font-size: 1.5rem;
      color: #e63946;
      border: 2px solid #e63946;
      border-radius: 30px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .enter-button:hover {
      background-color: #e63946;
      color: #fff;
      transform: scale(1.05);
    }

    .love-note {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 1.2rem;
      color: #ff6b81;
      opacity: 0.9;
      pointer-events: none; /* so it doesn't block clicks */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes bounce {
      from { transform: translateY(0px); }
      to { transform: translateY(-15px); }
    }

    @media(max-width: 500px) {
      h1 { font-size: 2.5rem; }
      .cat-img { width: 100px; }
      .enter-button { padding: 12px 35px; font-size: 1.2rem; }
      .love-note { font-size: 1rem; bottom: 15px; right: 15px; }
    }
  </style>
</head>
<body>

  <div class="landing-content">
    
    <!-- Handwritten Text -->
    <h1>Hello <span class="red">Baby...</span></h1>

    <!-- Proceed Button -->
    <a href="main.html" class="enter-button">Proceed</a>

  </div>

  <!-- Love Note in Corner -->
  <div class="love-note">with lots of love, Eileen</div>

</body>
</html>
